spring:
  application:
    name: inter-a-to-z
  profiles:
    active: local
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE

server:
  port: 8080

app:
  jwt:
    secret: "${JWT_SECRET:local-dev-secret-key-change-me-please-32bytes}"
    expiration-ms: 86400000
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
  seed:
    admin-email: "${ADMIN_EMAIL:admin@interx.io}"
    admin-password: "${ADMIN_PASSWORD:admin1234!}"
    demo-email: "${DEMO_EMAIL:newbie@interx.io}"
    demo-password: "${DEMO_PASSWORD:demo1234!}"
  chatbot:
    provider: "${CHATBOT_PROVIDER:mock}"
    api-key: "${CHATBOT_API_KEY:}"

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:onboarding;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:railway}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}"
    password: "${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always

server:
  port: "${PORT:8080}"
